<head>

<body id="e">
    <button onclick="darkMode()">dark mode</button>
    <button onclick="lightMode()">light mode</button>
    <script>

        function darkMode()
        {
        {
                 document.getElementById("e").style.backgroundColor="black";
        }
    }
    function lightMode()
        {
        {
                 document.getElementById("e").style.backgroundColor="white"; 
        }
    }
    </script>
</body>
